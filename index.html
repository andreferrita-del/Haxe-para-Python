<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Haxe → Python</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logos">
                <img src="https://haxe.org/img/haxe-logo.svg" 
                     alt="Haxe" class="logo-img" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="logo-fallback fallback-hx" style="display:none;">Hx</span>
                
                <span class="arrow">➡️</span>
                
                <img src="https://www.python.org/static/img/python-logo.png" 
                     alt="Python" class="logo-img" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="logo-fallback fallback-py" style="display:none;">Py</span>
            </div>
            <h1>Conversor Haxe → Python</h1>
            <p>Converta código Haxe para Python automaticamente</p>
        </div>
        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title"><span class="icon icon-hx">Hx</span> Haxe</span>
                    <div class="btns">
                        <button class="btn-paste" id="pasteBtn">📋 Colar</button>
                        <button class="btn-select" id="selectHaxeBtn">✅ Selecionar</button>
                        <button class="btn-example" id="exampleBtn">📝 Exemplo</button>
                        <button class="btn-clear" id="clearHaxeBtn">🗑️</button>
                    </div>
                </div>
                <textarea id="haxeCode" placeholder="Cole seu código Haxe aqui..."></textarea>
                <div class="char-count"><span id="haxeCharCount">0</span> caracteres</div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title"><span class="icon icon-py">Py</span> Python</span>
                    <div class="btns">
                        <button class="btn-convert" id="convertBtn">⚡ Converter</button>
                        <button class="btn-select" id="selectPythonBtn">✅ Selecionar</button>
                        <button class="btn-copy" id="copyBtn">📋 Copiar</button>
                        <button class="btn-clear" id="clearPythonBtn">🗑️</button>
                    </div>
                </div>
                <textarea id="pythonCode" placeholder="O código Python aparecerá aqui..." readonly></textarea>
                <div class="char-count"><span id="pythonCharCount">0</span> caracteres</div>
            </div>
        </div>
        <div class="info"><span id="statusText">Conversor pronto</span><span id="conversionTime"></span></div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="scripts/converter.js"></script>
    <script src="scripts/converter-extra.js"></script>
</body>
</html>
